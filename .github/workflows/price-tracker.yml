name: Bookswagon Price Tracker

permissions:
  contents: write

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC | 8:00 PM IST = 2:30 PM UTC
    - cron: '30 2,14 * * *'
  workflow_dispatch: # allows manual trigger from Actions tab

jobs:
  track-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for keepalive commit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price tracker
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Evening run (8pm IST) and manual runs send the full digest.
          # Morning run (8am IST) only alerts on price drops.
          SEND_DIGEST: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 14 * * *' }}
        run: python tracker.py

      - name: Commit price history if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          if git diff --cached --quiet; then
            echo "No price changes to commit"
          else
            git commit -m "chore: update price history [skip ci]"
            git push
          fi

      - name: Keepalive commit if repo idle
        run: |
          # Only commits if the repo hasn't had activity in a while, instead
          # of unconditionally on every run (prevents GitHub from disabling
          # the cron after 60 days of inactivity, without spamming history).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          last_commit_epoch=$(git log -1 --format=%ct)
          now_epoch=$(date +%s)
          days_since=$(( (now_epoch - last_commit_epoch) / 86400 ))
          echo "Days since last commit: $days_since"
          if [ "$days_since" -ge 45 ]; then
            git commit --allow-empty -m "ci: keepalive commit [skip ci]"
            git push
          else
            echo "Repo active, skipping keepalive"
          fi
